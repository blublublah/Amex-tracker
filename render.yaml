# Render deploy (needs a paid instance for the persistent disk).
services:
  - type: web
    name: platinum-credit-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk: { name: data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: BASE_URL, sync: false }
      - { key: SECRET_KEY, generateValue: true }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
